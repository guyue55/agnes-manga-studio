<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agnes 漫剧工坊 · 本地版</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D6B56D'/%3E%3Cpath d='M9 22V10h3.4l3.6 7 3.6-7H23v12h-3v-7l-3 5.8h-2L12 15v7z' fill='%2308090D'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <!-- 服务端跑的是旧代码时的横幅（批 8 补 27）：前端是每次从磁盘读的、后端只在启动时读一次，
           不说明白的话，页面上的新功能会报"接口不存在"，看起来像功能没做 -->
      <div id="stale-bar"></div>
      <div id="view"></div>
    </main>
  </div>
  <!-- 反馈层必须可被屏幕阅读器宣告：容器为 polite 状态区，错误 toast 自身用 role=alert 提为强宣告 -->
  <div id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
